[project]
name = "STAC-Fastapi-Ingester"
dynamic = ["version"]
description = "Ingester for loading STAC items, collections and catalogs into STAC-Fastapi, triggered by Pulsar messaging."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {file = "LICENSE.txt"}
authors = [
  {name = "Telespazio UK Ltd", email = "thomas.jellicoe@telespazio.com" }
]
maintainers = [
  {name = "Telespazio UK Ltd", email = "thomas.jellicoe@telespazio.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "certifi",
    "click",
    "pulsar-client",
    "boto3",
    "requests>=2.32.4",
    "botocore",
    "eodhp-utils",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "requests-mock",
    "ruff",
    "validate-pyproject",
]

[project.urls]
homepage = "https://github.com/EO-DataHub/"
repository = "https://github.com/EO-DataHub/stac-fastapi-ingester"
changelog = "https://github.com/EO-DataHub/stac-fastapi-ingester/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["stac_fastapi_ingester"]

[tool.uv]
package = true

[tool.uv.sources]
eodhp-utils = { git = "https://github.com/EO-DataHub/eodhp-utils", tag = "v0.1.12" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "integrationtest: Integration test"
]

[tool.pyright]
exclude = ["stac-fastapi-pulsar-test.py", ".venv"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 119
extend-exclude = ["stac-fastapi-pulsar-test.py"]

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "E501",   # line too long
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008",   # function call in default argument (incompatible with FastAPI)
    "ANN401", # dynamically typed expressions (Any) are disallowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PT006"]
